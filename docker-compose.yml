services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-monitoring}
      - POSTGRES_USER=${POSTGRES_USER:-monitoring}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-monitoring}
    ports:
      - "5432:5432"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitoring} -d ${POSTGRES_DB:-monitoring}"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    command: uvicorn server.main:app --host 0.0.0.0 --port 8000 --no-access-log
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://monitoring:monitoring@postgres:5432/monitoring}
      - ALLOW_DEV_SEED_ALERTS=${ALLOW_DEV_SEED_ALERTS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://127.0.0.1:8000/health', timeout=5); raise SystemExit(0 if r.status_code==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 6

  mcp_server:
    build:
      context: .
      dockerfile: Dockerfile.server
    command: python -m mcp_server.main
    ports:
      - "8765:8765"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://monitoring:monitoring@postgres:5432/monitoring}
      - SERVER_URL=http://server:8000
    depends_on:
      server:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(5); s.connect(('127.0.0.1',8765)); s.close()"]
      interval: 60s
      timeout: 5s
      retries: 6

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    command: streamlit run ui/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      - SERVER_URL=http://server:8000
      - MCP_URL=http://mcp_server:8765/mcp
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
    depends_on:
      server:
        condition: service_started
      mcp_server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://127.0.0.1:8501', timeout=5); raise SystemExit(0 if r.status_code==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 6

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    profiles:
      - demo-agent
    environment:
      - SERVER_URL=http://server:8000
      - HOST_ID=container-host-01
      - HOST_NAME=Контейнер-1
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,os; r=httpx.get(os.getenv('SERVER_URL','http://server:8000')+'/health', timeout=5); raise SystemExit(0 if r.status_code==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
